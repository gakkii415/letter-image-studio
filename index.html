<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="書体・字間・行間を調整して、縦書きと横書きのレタリング画像を作成。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LETTERING</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?c=3680df3f55">
  <script type="module" src="./app.js?c=cd804a708e"></script>
</head>
<body>
  <main class="app-shell" aria-label="レタリング画像の作成">
    <header class="app-header">
      <h1>LETTERING</h1>
      <!-- app-version:start --><small id="app-version">v6</small><!-- app-version:end -->
      <button id="open-fonts" class="fonts-button" type="button" aria-haspopup="dialog">書体 2</button>
    </header>

    <section class="canvas-area" aria-label="文字画像のプレビュー">
      <div id="preview-stage" class="preview-stage">
        <div id="preview-transform"><div id="live-preview"></div></div>
        <img id="preview-image" alt="文字画像のプレビュー" hidden>
        <div id="preview-empty" class="preview-empty">文字を入力してください</div>
      </div>
      <span id="image-dimensions" class="image-dimensions">—</span>
      <div class="camera-toolbar" role="group" aria-label="キャンバス表示">
        <button id="toggle-preview" type="button" aria-label="画像全体を表示">全体</button>
      </div>
      <p id="render-status" class="render-status" aria-live="polite"></p>
    </section>

    <div class="text-bar">
      <label class="text-input-label" for="text-input">文字入力</label>
      <textarea id="text-input" rows="3" maxlength="800" spellcheck="false" placeholder="例：永遠&#10;Stay true">永遠</textarea>
      <span id="char-count" class="char-count">2 / 160</span>
    </div>

    <section id="controls" class="adjustment-panel" aria-label="文字の調整">
      <div class="control-tabs" role="tablist" aria-label="調整する項目">
        <button id="tab-tracking" type="button" role="tab" data-control="tracking" aria-controls="panel-tracking" aria-selected="true" class="is-active">字間</button>
        <button id="tab-line" type="button" role="tab" data-control="line" aria-controls="panel-line" aria-selected="false" tabindex="-1">行間</button>
        <button id="tab-color" type="button" role="tab" data-control="color" aria-controls="panel-color" aria-selected="false" tabindex="-1">色</button>
      </div>
      <div class="adjustment-body">
        <div class="control-value-row"><label class="sr-only" for="control-number">字間を数値で指定</label><input id="control-number" type="number" inputmode="decimal" min="-0.2" max="0.8" step="0.025" value="0" aria-label="字間を数値で指定"><span id="control-unit">em</span></div>
        <div class="adjustment-row">
          <button id="step-down" class="step-button" type="button" aria-label="値を小さくする">−</button>
          <div class="control-panels">
            <div id="panel-tracking" class="control-panel" data-panel="tracking" role="tabpanel" aria-labelledby="tab-tracking"><label class="sr-only" for="tracking-input">字間</label><input id="tracking-input" type="range" min="-0.2" max="0.8" value="0" step="0.025"><output id="tracking-value" class="sr-only" for="tracking-input">0.00em</output></div>
            <div id="panel-line" class="control-panel" data-panel="line" role="tabpanel" aria-labelledby="tab-line" hidden><label class="sr-only" for="line-input">行間</label><input id="line-input" type="range" min="0.8" max="2.4" value="1.5" step="0.05"><output id="line-value" class="sr-only" for="line-input">1.50倍</output></div>
            <div id="panel-color" class="control-panel color-panel" data-panel="color" role="tabpanel" aria-labelledby="tab-color" hidden>
              <div class="color-palette" role="group" aria-label="文字色を選択">
                <button class="color-quick" type="button" data-quick-color="#000000" style="--quick-color:#000000" aria-label="黒" aria-pressed="true"></button>
                <button class="color-quick" type="button" data-quick-color="#4b5563" style="--quick-color:#4b5563" aria-label="グラファイト" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#c62828" style="--quick-color:#c62828" aria-label="赤" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#d65a16" style="--quick-color:#d65a16" aria-label="橙" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#a87713" style="--quick-color:#a87713" aria-label="黄土色" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#2e7d32" style="--quick-color:#2e7d32" aria-label="緑" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#007f78" style="--quick-color:#007f78" aria-label="青緑" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#1565c0" style="--quick-color:#1565c0" aria-label="青" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#253b80" style="--quick-color:#253b80" aria-label="紺" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#7b35b5" style="--quick-color:#7b35b5" aria-label="紫" aria-pressed="false"></button>
                <button class="color-quick" type="button" data-quick-color="#b32d77" style="--quick-color:#b32d77" aria-label="赤紫" aria-pressed="false"></button>
                <button id="open-color" class="color-quick color-more" type="button" aria-label="その他の色を選ぶ" aria-haspopup="dialog" aria-controls="color-dialog">
                  <span class="color-more-plus" aria-hidden="true">＋</span><span class="color-more-label">その他</span>
                  <span id="color-open-chip" class="sr-only" aria-hidden="true"></span><span id="color-open-value" class="sr-only">#000000</span>
                </button>
              </div>
            </div>
          </div>
          <button id="step-up" class="step-button" type="button" aria-label="値を大きくする">＋</button>
        </div>
      </div>
    </section>

    <div class="save-bar"><button id="save-button" class="save-button" type="button" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-3-3 3 3 3-3M4 11v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/></svg><span>画像を保存</span><small>PNG</small></button></div>
  </main>

  <dialog id="font-dialog" class="font-dialog" aria-labelledby="fonts-heading">
    <div class="dialog-heading"><h2 id="fonts-heading">書体</h2><button id="close-fonts" class="icon-button" type="button" aria-label="書体選択を閉じる"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <div id="font-list" class="font-list" aria-label="表示する書体を選択"></div>
    <details class="font-add-section"><summary>追加<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></summary>
      <div class="font-add-content">
        <div id="catalog-list" class="catalog-list"></div>
        <label class="file-picker" for="font-file"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m-3 3 3-3 3 3M4 12v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4"/></svg><span>ファイルから追加</span><small>TTF / OTF / WOFF2</small><input id="font-file" type="file" accept=".ttf,.otf,.woff,.woff2" multiple></label>
        <details class="url-import"><summary>URLから追加</summary><div class="url-row"><label class="sr-only" for="font-url">フォントファイルのURL</label><input id="font-url" type="url" inputmode="url" placeholder="https://…/font.woff2"><button id="import-url" type="button">追加</button></div></details>
        <p id="font-import-status" class="import-status" aria-live="polite"></p>
        <div class="font-sources"><a href="https://fonts.google.com/?subset=japanese" target="_blank" rel="noopener noreferrer">Google Fonts ↗</a><a href="https://fontfree.me/" target="_blank" rel="noopener noreferrer">FONT FREE ↗</a></div>
        <p class="font-note">追加した書体はこのブラウザに保存。</p>
      </div>
    </details>
    <details class="advanced-settings"><summary>折り返し</summary><div class="range-field"><label for="wrap-input">1行</label><input id="wrap-input" type="range" min="6" max="24" value="12" step="1"><output id="wrap-value" for="wrap-input">12文字</output></div></details>
  </dialog>

<dialog id="color-dialog" class="color-dialog" aria-labelledby="color-heading">
  <div class="dialog-heading">
    <h2 id="color-heading">色</h2>
    <button id="close-color" class="icon-button" type="button" aria-label="色を閉じる">×</button>
  </div>
  <div id="color-field" class="color-field" tabindex="0" role="slider" aria-label="彩度と明度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="彩度 0%、明度 0%" aria-describedby="color-keyboard-help">
    <span id="color-thumb" class="color-thumb" aria-hidden="true"></span>
  </div>
  <span id="color-keyboard-help" class="sr-only">左右キーで彩度、上下キーで明度を調整</span>
  <label class="sr-only" for="hue-input">色相</label>
  <input id="hue-input" class="hue-input" type="range" min="0" max="360" step="1" value="0">
  <div class="color-value-row">
    <span id="picker-color-chip" class="picker-color-chip" role="img" aria-label="選択中の色 #000000"></span>
    <label for="hex-input">HEX</label>
    <input id="hex-input" type="text" value="#000000" maxlength="7" spellcheck="false" autocapitalize="characters" autocorrect="off" autocomplete="off" aria-label="HEXカラーコード">
  </div>
  <div class="color-swatches" aria-label="モノクロ">
    <button type="button" data-picker-color="#000000" aria-label="黒 #000000" aria-pressed="true"></button>
    <button type="button" data-picker-color="#333333" aria-label="ダークグレー #333333" aria-pressed="false"></button>
    <button type="button" data-picker-color="#666666" aria-label="グレー #666666" aria-pressed="false"></button>
  </div>
  <div id="recent-colors-section" hidden>
    <h3 class="color-recent-heading">最近使った色</h3>
    <div id="recent-colors" class="color-swatches">
      <button type="button" data-recent-index="0" hidden></button>
      <button type="button" data-recent-index="1" hidden></button>
      <button type="button" data-recent-index="2" hidden></button>
      <button type="button" data-recent-index="3" hidden></button>
      <button type="button" data-recent-index="4" hidden></button>
      <button type="button" data-recent-index="5" hidden></button>
    </div>
  </div>
</dialog>

  <dialog id="save-dialog" class="save-dialog" aria-labelledby="save-heading">
    <div class="dialog-heading"><h2 id="save-heading">保存</h2><button id="close-save" class="icon-button" type="button" aria-label="保存画面を閉じる"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <p id="save-status" class="save-status" aria-live="polite">画像を準備しています…</p>
    <p class="save-guide">画像を長押し → 写真に保存</p>
    <img id="saved-image" alt="保存用の文字画像">
    <button id="download-button" class="download-button" type="button" disabled>PNGをダウンロード<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m-3-3 3 3 3-3M4 13v4h12v-4"/></svg></button>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
