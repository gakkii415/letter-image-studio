<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="書体・字間・行間を調整して、縦書きと横書きのレタリング画像を作成。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>LETTERING</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css?c=8b1821451b">
  <script type="module" src="./app.js?c=6e55659b57"></script>
</head>
<body>
  <main class="app-shell" aria-label="レタリング画像の作成">
    <header class="app-header">
      <h1>LETTERING</h1>
      <!-- app-version:start --><small id="app-version">v3</small><!-- app-version:end -->
      <button id="open-fonts" class="fonts-button" type="button" aria-haspopup="dialog">書体 2</button>
    </header>

    <div class="text-bar">
      <label class="sr-only" for="text-input">画像にする文字</label>
      <textarea id="text-input" rows="2" maxlength="800" spellcheck="false" placeholder="文字を入力">永遠</textarea>
      <span id="char-count" class="char-count">9 / 160</span>
    </div>

    <div class="canvas-toolbar">
      <div class="direction-switch" role="group" aria-label="書き方向">
        <button id="direction-both" type="button" data-mode="both" class="is-active" aria-pressed="true">両方</button>
        <button id="direction-horizontal" type="button" data-mode="horizontal" aria-pressed="false">横書き</button>
        <button id="direction-vertical" type="button" data-mode="vertical" aria-pressed="false">縦書き</button>
      </div>
      <button id="toggle-preview" class="zoom-button" type="button" aria-label="プレビューを拡大" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg><span>拡大</span></button>
    </div>

    <section class="canvas-area" aria-label="文字画像のプレビュー">
      <div id="preview-stage" class="preview-stage">
        <img id="preview-image" alt="文字画像のプレビュー" hidden>
        <div id="preview-empty" class="preview-empty">文字を入力してください</div>
      </div>
      <span id="image-dimensions" class="image-dimensions">—</span>
      <p id="render-status" class="render-status" aria-live="polite"></p>
    </section>

    <section id="controls" class="adjustment-panel" aria-label="文字の調整">
      <div class="range-field"><label for="size-input">サイズ</label><input id="size-input" type="range" min="28" max="72" value="44" step="1"><output id="size-value" for="size-input">44px</output></div>
      <div class="range-field"><label for="tracking-input">字間</label><input id="tracking-input" type="range" min="-0.2" max="0.8" value="0.1" step="0.025"><output id="tracking-value" for="tracking-input">+0.10em</output></div>
      <div class="range-field"><label for="line-input">行間</label><input id="line-input" type="range" min="0.8" max="2.4" value="1.5" step="0.05"><output id="line-value" for="line-input">1.50倍</output></div>
      <div class="color-row">
        <span class="control-label">色</span>
        <div class="color-options" role="group" aria-label="文字色">
          <button class="color-swatch is-selected" data-color="#000000" style="--swatch:#000000" type="button" aria-label="黒" aria-pressed="true"></button>
          <button class="color-swatch" data-color="#b84b3b" style="--swatch:#b84b3b" type="button" aria-label="朱" aria-pressed="false"></button>
          <button class="color-swatch" data-color="#304f6e" style="--swatch:#304f6e" type="button" aria-label="藍" aria-pressed="false"></button>
          <button class="color-swatch" data-color="#536757" style="--swatch:#536757" type="button" aria-label="緑" aria-pressed="false"></button>
          <label class="custom-color" title="色を指定"><span aria-hidden="true">＋</span><input id="color-input" type="color" value="#000000" aria-label="文字色を指定"></label>
        </div>
        <span id="color-value" class="color-value">#000000</span>
      </div>
    </section>

    <div class="save-bar"><button id="save-button" class="save-button" type="button" disabled><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-3-3 3 3 3-3M4 11v5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-5"/></svg><span>画像を保存</span><small>PNG</small></button></div>
  </main>

  <dialog id="font-dialog" class="font-dialog" aria-labelledby="fonts-heading">
    <div class="dialog-heading"><h2 id="fonts-heading">書体</h2><button id="close-fonts" class="icon-button" type="button" aria-label="書体選択を閉じる"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <div id="font-list" class="font-list" aria-label="表示する書体を選択"></div>
    <details class="font-add-section"><summary>追加<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></summary>
      <div class="font-add-content">
        <div id="catalog-list" class="catalog-list"></div>
        <label class="file-picker" for="font-file"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 13V3m-3 3 3-3 3 3M4 12v4a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-4"/></svg><span>ファイルから追加</span><small>TTF / OTF / WOFF2</small><input id="font-file" type="file" accept=".ttf,.otf,.woff,.woff2" multiple></label>
        <details class="url-import"><summary>URLから追加</summary><div class="url-row"><label class="sr-only" for="font-url">フォントファイルのURL</label><input id="font-url" type="url" inputmode="url" placeholder="https://…/font.woff2"><button id="import-url" type="button">追加</button></div></details>
        <p id="font-import-status" class="import-status" aria-live="polite"></p>
        <div class="font-sources"><a href="https://fonts.google.com/?subset=japanese" target="_blank" rel="noopener noreferrer">Google Fonts ↗</a><a href="https://fontfree.me/" target="_blank" rel="noopener noreferrer">FONT FREE ↗</a></div>
        <p class="font-note">追加した書体はこのブラウザに保存。</p>
      </div>
    </details>
    <details class="advanced-settings"><summary>折り返し</summary><div class="range-field"><label for="wrap-input">1行</label><input id="wrap-input" type="range" min="6" max="24" value="12" step="1"><output id="wrap-value" for="wrap-input">12文字</output></div></details>
  </dialog>

  <dialog id="save-dialog" class="save-dialog" aria-labelledby="save-heading">
    <div class="dialog-heading"><h2 id="save-heading">保存</h2><button id="close-save" class="icon-button" type="button" aria-label="保存画面を閉じる"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <p class="save-guide">画像を長押し → 写真に保存</p>
    <img id="saved-image" alt="保存用の文字画像">
    <button id="download-button" class="download-button" type="button" disabled>PNGをダウンロード<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m-3-3 3 3 3-3M4 13v4h12v-4"/></svg></button>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
